<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dash Duel — souboj dvou hráčů</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- Tlačítko zvuku -->
    <button id="mute-btn" title="Zvuk">🔊</button>

    <!-- Nápis úrovně -->
    <div class="banner" id="banner"></div>

    <!-- Skóre nahoře/dole -->
    <div class="hud hud-top" id="hud-top">
      <span class="hud-name" id="name-top">HRÁČ&nbsp;1</span>
      <span class="hud-power" id="power-top"></span>
      <span class="hud-score" id="score-top">0</span>
      <span class="hud-key" id="key-top">klávesa&nbsp;W</span>
    </div>
    <div class="hud hud-bottom" id="hud-bottom">
      <span class="hud-name" id="name-bottom">HRÁČ&nbsp;2</span>
      <span class="hud-power" id="power-bottom"></span>
      <span class="hud-score" id="score-bottom">0</span>
      <span class="hud-key" id="key-bottom">šipka&nbsp;↑</span>
    </div>

    <!-- Tlačítko speciálu (online / dotyk) -->
    <button id="special-btn" class="hidden">⚡ ZNIČIT</button>

    <!-- ====== HLAVNÍ MENU ====== -->
    <section class="screen" id="screen-menu">
      <h1 class="title">DASH&nbsp;DUEL</h1>
      <p class="subtitle">Kdo vydrží déle, vyhrává.</p>
      <div class="menu-buttons">
        <button class="btn" data-act="local">🎮&nbsp; Hra na jednom zařízení<small>dva hráči, jedna klávesnice</small></button>
        <button class="btn" data-act="host">🌐&nbsp; Začít novou hru online<small>vygeneruje se kód pro spoluhráče</small></button>
        <button class="btn btn-ghost" data-act="join">🔑&nbsp; Připojit se k existující hře<small>zadej kód od spoluhráče</small></button>
      </div>
    </section>

    <!-- ====== HOSTITEL: čekání ====== -->
    <section class="screen hidden" id="screen-host">
      <h2 class="screen-title">Tvůj kód hry</h2>
      <div class="code-box" id="host-code">······</div>
      <p class="screen-text">Řekni tento kód druhému hráči. Až ho zadá na svém zařízení, hra začne.</p>
      <p class="status" id="host-status">⏳ Čekání na druhého hráče…</p>
      <button class="btn btn-ghost small" data-act="back">← Zpět do menu</button>
    </section>

    <!-- ====== PŘIPOJENÍ: zadání kódu ====== -->
    <section class="screen hidden" id="screen-join">
      <h2 class="screen-title">Připojit se ke hře</h2>
      <p class="screen-text">Zadej kód, který ti řekl spoluhráč.</p>
      <input class="code-input" id="join-code" maxlength="6" autocomplete="off"
             autocapitalize="characters" spellcheck="false" placeholder="ABCD12" />
      <p class="error" id="join-error"></p>
      <div class="row">
        <button class="btn small" data-act="connect">Připojit se</button>
        <button class="btn btn-ghost small" data-act="back">← Zpět</button>
      </div>
    </section>

    <!-- ====== Herní překryv (start / konec) ====== -->
    <div class="overlay hidden" id="overlay">
      <p class="subtitle" id="overlay-text"></p>
      <p class="overlay-score" id="overlay-score"></p>
      <div class="hint" id="overlay-hint"></div>
      <button class="btn btn-ghost small overlay-menu" data-act="back">← Menu</button>
    </div>

    <!-- ====== Odpočet ====== -->
    <div class="countdown" id="countdown"></div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
